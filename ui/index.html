<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoKVM Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tabbar" role="tablist" aria-label="Open consoles">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4M7 8l3 2-3 2M12 12h4"/></svg>
    <button id="home-tab" class="tab home" role="tab" aria-selected="true">Devices</button>
    <div id="tabs" class="tabs"></div>
  </nav>

  <div id="stage" class="stage">
    <section id="home" class="home">
      <div class="home-head">
        <h1>Devices</h1>
        <label id="filter" class="filter" hidden>Show
          <select id="group-filter" aria-label="Show devices from">
            <option value="">All devices</option>
          </select>
        </label>
        <div class="actions">
          <button id="refresh" class="ghost" title="Check all devices">Refresh</button>
          <button id="add" class="primary">Add device</button>
        </div>
      </div>
      <p id="error" class="error" hidden></p>
      <section id="empty" class="empty" hidden>
        <h2>No devices yet</h2>
        <p>Add a NanoKVM by its IP address or hostname to open its console from here.</p>
        <button class="primary" data-action="add">Add your first device</button>
      </section>
      <ul id="devices" class="grid"></ul>
      <div id="pve"></div>
    </section>
    <!-- Shown under a console tab's webview until it paints. -->
    <div id="placeholder" class="placeholder" hidden>Connecting…</div>
  </div>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="dialog-title">Add device</h2>
      <label>Type
        <select name="kind" required>
          <option value="" disabled>Choose a type…</option>
          <option value="nanokvm">NanoKVM</option>
          <option value="supermicro-ikvm">Supermicro BMC (legacy Java iKVM)</option>
          <option value="proxmox">Proxmox VE server (lists its VMs as a group)</option>
        </select>
      </label>
      <label>Name
        <input name="name" required placeholder="e.g. Rack server" autocomplete="off">
      </label>
      <label id="group-row">Group <small>(optional)</small>
        <input name="group" list="group-list" placeholder="e.g. Rack A" autocomplete="off">
      </label>
      <datalist id="group-list"></datalist>
      <label>Address
        <input name="url" required placeholder="e.g. 192.168.1.50 or https://kvm.lan" autocomplete="off" spellcheck="false">
      </label>
      <fieldset>
        <legend id="login-legend">Login (optional)</legend>
        <label>Username
          <input name="username" autocomplete="off" spellcheck="false">
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="new-password">
          <small id="password-hint" hidden>A password is saved. Leave blank to keep it.
            <button type="button" id="clear-password" class="link">Forget it</button></small>
        </label>
        <label class="check" id="autologin-row">
          <input name="autoLogin" type="checkbox">
          Log in automatically when connecting
        </label>
        <p id="login-hint" class="hint" hidden></p>
        <p id="cert-row" class="hint" hidden>Pinned certificate (SHA-256): <code id="cert-fp"></code>
          <button type="button" id="forget-cert" class="link">Forget certificate</button></p>
      </fieldset>
      <p id="form-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-msg" class="muted"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="danger-solid">Delete</button>
      </div>
    </form>
  </dialog>

  <template id="card">
    <li class="card">
      <div class="card-head">
        <span class="dot" data-status="unknown" title="Checking…"></span>
        <h3 class="name"></h3>
        <span class="group-tag" hidden></span>
      </div>
      <p class="url"></p>
      <p class="meta"></p>
      <div class="card-actions">
        <button class="primary" data-action="connect" title="Open in a tab">Connect</button>
        <button class="ghost icon" data-action="window" title="Open in new window" aria-label="Open in new window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="ghost" data-action="edit">Edit</button>
        <button class="ghost danger" data-action="delete">Delete</button>
      </div>
    </li>
  </template>

  <template id="pve-section">
    <section class="pve">
      <div class="pve-head">
        <span class="dot" data-status="unknown"></span>
        <h2 class="name"></h2>
        <span class="pve-sub"></span>
        <span class="spacer"></span>
        <button class="ghost" data-action="refresh" title="Reload the list of VMs and containers">Refresh</button>
        <button class="ghost" data-action="edit">Edit</button>
        <button class="ghost danger" data-action="delete">Delete</button>
      </div>
      <p class="pve-cert"></p>
      <p class="error pve-error" hidden></p>
      <ul class="grid guests"></ul>
    </section>
  </template>

  <template id="guest-card">
    <li class="card guest">
      <div class="card-head">
        <span class="dot" data-status="unknown"></span>
        <h3 class="name"></h3>
        <span class="group-tag kind-tag"></span>
      </div>
      <p class="url"></p>
      <p class="meta"></p>
      <div class="card-actions">
        <button class="primary" data-action="connect" title="Open in a tab">Connect</button>
        <button class="ghost icon" data-action="window" title="Open in new window" aria-label="Open in new window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
      </div>
    </li>
  </template>

  <template id="tab">
    <div class="tab console" role="tab" aria-selected="false">
      <span class="dot" data-status="unknown"></span>
      <span class="tab-name"></span>
      <button class="tab-btn" data-tab-action="popout" title="Open in new window" aria-label="Open in new window">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </button>
      <button class="tab-btn" data-tab-action="close" title="Close tab" aria-label="Close tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
