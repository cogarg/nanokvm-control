[package]
name = "nanokvm-control"
version = "0.3.0"
description = "Desktop control center for Sipeed NanoKVM devices"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }  # unstable: multiple webviews per window (console tabs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"

[features]
# Serve the bundled ui/ folder even for plain `cargo run` (no dev server is used).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Linux: console tabs are laid out with a GtkOverlay (see gtk_overlay in main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
