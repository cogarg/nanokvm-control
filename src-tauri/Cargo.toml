[package]
name = "nanokvm-control"
version = "0.5.0"
description = "Desktop control center for Sipeed NanoKVM devices"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }  # unstable: multiple webviews per window (console tabs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
des = "0.8"

[features]
# Serve the bundled ui/ folder even for plain `cargo run` (no dev server is used).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Linux: console tabs are laid out with a GtkOverlay (see gtk_overlay in main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
